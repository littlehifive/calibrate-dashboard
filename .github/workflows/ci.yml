name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: index.html matches src/
        run: npm run check
      - name: No data files in the repository
        run: |
          found=$(git ls-files | grep -Ei '\.(csv|tsv|xlsx)$|-protected-.*\.html$' || true)
          if [ -n "$found" ]; then echo "Data files must not be committed:"; echo "$found"; exit 1; fi
